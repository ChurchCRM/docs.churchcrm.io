name: CodeRabbit approval

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  coderabbit:
    name: CodeRabbit approval
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Require a CodeRabbit approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          state=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.user.login=="coderabbitai")] | last | .state // "NONE"')
          echo "Latest CodeRabbit review: ${state}"
          if [ "$state" != "APPROVED" ]; then
            echo "::error::CodeRabbit has not approved this pull request."
            exit 1
          fi
