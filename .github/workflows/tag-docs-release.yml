name: Tag published docs release

on:
  push:
    branches: [main]
    paths:
      - crm-release.json

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Point the version tag and branch at this commit
        run: ./scripts/ci/tag-docs-release.sh
