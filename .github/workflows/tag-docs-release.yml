name: Tag published docs release

on:
  push:
    branches: [main]
    paths:
      - crm-release.json

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Point the version tag and branch at this commit
        run: ./scripts/ci/tag-docs-release.sh
