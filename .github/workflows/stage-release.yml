name: Publish docs for a CRM release

# CRM release-publish.yml and release-bookkeeping.yml dispatch crm-released.
# The daily run is the backup when that dispatch does not arrive.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable CRM version to publish, for example 7.8.0. Blank uses the latest stable release.'
        required: false
        type: string
  repository_dispatch:
    types: [crm-released]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: docs-stage-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Publish the released docs version
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
          NEXT_VERSION: ${{ github.event.client_payload.next_version }}
          MERGE: ${{ github.event.client_payload.merge == false && 'false' || github.event.client_payload.merge || 'true' }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION:-}" ]; then
            VERSION=$(gh api repos/ChurchCRM/CRM/releases/latest --jq '.tag_name')
          fi
          export VERSION
          ./scripts/ci/publish-docs-release.sh
