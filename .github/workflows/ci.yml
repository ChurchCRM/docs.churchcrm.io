name: Docs CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    branches: [main, 'release-docs/**']
  workflow_dispatch:

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Docusaurus site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so showLastUpdateTime has a real date in CI builds.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download pinned OpenAPI specs
        run: ./scripts/download-openapi.sh

      - name: Generate API docs
        run: npm run regen

      - name: Typecheck
        run: npm run typecheck

      - name: Check screenshots are not stored here
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-visuals.mjs

      - name: Build site
        run: npm run build
