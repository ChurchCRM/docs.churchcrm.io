name: Docs CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Released software gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Hold product docs until the matching CRM release is published
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/ci/hold-until-released.sh

  validate:
    name: Validate Docusaurus site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so showLastUpdateTime has a real date in CI builds.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download pinned OpenAPI specs
        run: ./scripts/download-openapi.sh

      - name: Generate API docs
        run: npm run regen

      - name: Typecheck
        run: npm run typecheck

      - name: Build site
        run: npm run build
