name: Release: sync docs milestone

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional release milestone to ensure (for example 7.7.1). Blank uses CRM master package.json.'
        required: false
        type: string

permissions:
  issues: write

concurrency:
  group: docs-release-milestone-sync
  cancel-in-progress: true

jobs:
  ensure-milestone:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Determine current CRM development release
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_VERSION:-}" ]; then
            version="$REQUESTED_VERSION"
          else
            version=$(curl -fsSL https://raw.githubusercontent.com/ChurchCRM/CRM/master/package.json | jq -r '.version')
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid CRM version: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CRM development release: $version"

      - name: Ensure matching docs milestone exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/milestones?state=all&per_page=100" \
            --jq ".[] | select(.title == \"$VERSION\") | .number" | head -n 1)

          if [ -n "$existing" ]; then
            echo "Docs milestone $VERSION already exists as #$existing"
            exit 0
          fi

          number=$(gh api "repos/${GITHUB_REPOSITORY}/milestones" \
            --method POST \
            -f title="$VERSION" \
            -f description="Documentation for ChurchCRM $VERSION. Product docs may merge only after the matching CRM release is published." \
            --jq '.number')
          echo "Created docs milestone $VERSION as #$number"
