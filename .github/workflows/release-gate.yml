name: Release Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, milestoned, demilestoned]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  release-gate:
    name: Released software gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate product documentation release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DOCS_REPO: ${{ github.repository }}
          CRM_REPO: ChurchCRM/CRM
        run: ./scripts/ci/validate-product-docs-release.sh
